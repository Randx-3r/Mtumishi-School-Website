 <!-- Students Section with Form Input -->
        <section id="students" class="student-register-section">
            <h2>Student Register</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Student Name:</label>
                    <input type="text" id="studentName" name="studentName" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="studentClass">Class:</label>
                    <input type="text" id="studentClass" name="studentClass" placeholder="e.g., Form 1" required>
                </div>

                <div class="form-group">
                    <label for="classStream">Class Stream:</label>
                    <select id="classStream" name="classStream" required>
                        <option value="">--Select Stream--</option>
                        <option value="North">North</option>
                        <option value="South">South</option>
                        <option value="East">East</option>
                        <option value="West">West</option>
                    </option>
                    </select>
                </div>

                <button type="submit">Register Student</button>
            </form>
        </section>
